name: Daily 6:10 PM Telegram Digest Cron

on:
  schedule:
    # 11:10 UTC = 18:10 (6:10 PM) Cambodia Time (UTC+7)
    - cron: '10 11 * * *'
    # 11:15 UTC = 18:15 (6:15 PM) fallback trigger in case the GitHub queue had a brief delay
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force dispatch (bypass today duplicate check)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  trigger-report:
    name: Trigger 6:10 PM Daily Digest
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Report Endpoint
        run: |
          echo "Triggering 6:10 PM Daily Report endpoint..."
          CRON_KEY="${{ secrets.CRON_SECRET }}"
          if [ -z "$CRON_KEY" ]; then
            CRON_KEY="signal-cron-daily-report-secure-key"
          fi

          QUERY=""
          if [ "${{ inputs.force }}" = "true" ]; then
            QUERY="?force=true"
          fi

          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" -X POST "https://ebook-transcript.vercel.app/api/cron/daily-report$QUERY" \
            -H "Authorization: Bearer $CRON_KEY" \
            -H "x-signal-cron: daily-digest" \
            -H "Content-Type: application/json")

          echo "HTTP Response Status: $HTTP_STATUS"
          cat "$RESPONSE_FILE"
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Daily report triggered successfully."
          else
            echo "❌ Failed to trigger daily report (HTTP $HTTP_STATUS)."
            exit 1
          fi
